name: prerelease
# Publishes a GitHub prerelease for every pull request push, tagged pr-<number>
# and replaced on each push, with the same archives the release workflow ships.
# Install one with: TK_VERSION=pr-44 sh install.sh
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TAG: pr-${{ github.event.pull_request.number }}
jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --package tk --bin tk --target "$TARGET"
      - name: Package archive and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="tk-${TARGET}-${TAG}"
          mkdir "$package"
          cp "target/$TARGET/release/tk" README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            tk-${{ matrix.target }}-${{ env.TAG }}.tar.gz
            tk-${{ matrix.target }}-${{ env.TAG }}.tar.gz.sha256
          if-no-files-found: error
  publish:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Remove the previous prerelease of this pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "$TAG" --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          prerelease: true
          body: |
            Automated build of ${{ github.event.pull_request.html_url }} at ${{ github.event.pull_request.head.sha }}.
            Install with `TK_VERSION=${{ env.TAG }} sh install.sh`.
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
